spring:
  application:
    name: fire-atlas-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/fireatlas}
    username: ${DB_USER:fireatlas}
    password: ${DB_PASSWORD:fireatlas}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024

fireatlas:
  cors-origins: ${CORS_ORIGINS:http://localhost:3000}
  cookie:
    same-site: ${COOKIE_SAME_SITE:Lax}   # use None + secure=true se o front estiver em outro dominio (HTTPS)
    secure: ${COOKIE_SECURE:false}
  s3:
    bucket: ${DATALAKE_BUCKET:}
    region: ${AWS_REGION:us-east-2}
    access-key-id: ${AWS_ACCESS_KEY_ID:}       # vazio = cadeia padrao da AWS (perfil local ou IAM Role)
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    session-token: ${AWS_SESSION_TOKEN:}
  athena:                                      # exportacao projetada do cache e consultas dos demais produtos
    database: ${ATHENA_DATABASE:fireatlas_gold}        # catalogo Glue com as tabelas Delta
    workgroup: ${ATHENA_WORKGROUP:fireatlas-api}       # workgroup com teto de bytes por consulta
    result-reuse-minutes: ${ATHENA_RESULT_REUSE_MINUTES:1440}   # validade do reuso de resultado (max 10080)
    timeout-ms: ${ATHENA_TIMEOUT_MS:30000}
  bootstrap:
    refresh-hours: ${BOOTSTRAP_REFRESH_HOURS:6}
    import-workers: ${BOOTSTRAP_IMPORT_WORKERS:2} # 1..4; cada trabalhador tem conexao e DuckDB proprios
    export-concurrency: ${BOOTSTRAP_EXPORT_CONCURRENCY:2} # UNLOADs simultaneos, limitados
    export-timeout-ms: ${BOOTSTRAP_EXPORT_TIMEOUT_MS:300000}
    export-prefix: ${BOOTSTRAP_EXPORT_PREFIX:} # vazio: destino do workgroup + bootstrap/2026/
  limits:
    max-days-points: 366
    max-days-compare: 400
    max-days-harmonize: 31
    max-days-predictions: 31
    max-points: 5000
    harmonize-timeout-ms: ${HARMONIZE_TIMEOUT_MS:10000}
  prediction:
    enabled: ${PREDICTION_ENABLED:false}
    endpoint-url: ${PREDICTION_PROVIDER_URL:}
    protocol-version: ${PREDICTION_PROTOCOL_VERSION:v1}
    connect-timeout-ms: ${PREDICTION_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${PREDICTION_READ_TIMEOUT_MS:5000}
    max-response-bytes: ${PREDICTION_MAX_RESPONSE_BYTES:1048576}
    max-predictions: ${PREDICTION_MAX_PREDICTIONS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
